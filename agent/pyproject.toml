[project]
name = "swil-agent"
version = "0.1.0"
description = "Swil Social agent runtime"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.scripts]
swil-agent = "swil_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swil_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"
# `scripts/` holds the pre-existing Bash-runtime tooling (out of scope for this
# migration and off-limits to modify); scope linting to the new package/tests.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001: this codebase embeds fullwidth Chinese punctuation (：，；etc.) by
# design, to match the Bash source and the real personality.md files.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# test_planner.py pins two full prompts (`_EXPECTED_EMPTY` / `_EXPECTED_POPULATED`)
# as triple-quoted string constants whose physical lines are the literal, real
# newline-delimited lines of auto-run.sh's own rendered output (contract 01 §4)
# -- several of those source lines already exceed 100 columns. Wrapping them
# would insert a newline that is not in the real prompt, silently turning the
# byte-for-byte pin into a paraphrase of its own expected value. Every other
# line in this file is subject to the normal E501 limit.
"tests/unit/test_planner.py" = ["E501"]
# Same reasoning as test_planner.py above: `_EXPECTED_EMPTY_USER` /
# `_EXPECTED_POPULATED_USER` are triple-quoted pins of dream.sh's own
# rendered heredoc output (contract 03 §2.4) -- some of its real lines (the
# echo-chamber sentence, the closing paragraph) exceed 100 columns on their
# own. Wrapping them would insert a newline the real prompt never contains.
"tests/unit/test_dream_candidate.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["swil_agent"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is MEASURED here but not GATED here. The floor lives at the two
# invocation sites that gate a merge -- scripts/ci-check.sh and the `python` job
# in .github/workflows/ci.yml -- both passing --cov-fail-under=97 explicitly.
#
# Why not in addopts: coverage is a whole-suite metric, but addopts applies to
# every invocation, so `uv run pytest tests/unit/test_foo.py` while iterating
# exits 1 with "coverage 24% < 97%" even when all its tests pass. That trains
# contributors to reach for --no-cov and then to ignore the gate entirely.
# Keeping --cov here preserves the local coverage report; the gate binds only
# where a merge is actually decided.
#
# The floor is pinned at the measured figure (97.73%, rounded down) as of the
# fix-wave that first turned it on, so it starts at today's level and can only
# ratchet up, never fail spuriously on an unrelated merge.
addopts = "-q --cov=swil_agent"
